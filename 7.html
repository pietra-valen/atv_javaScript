<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container {
            margin-top: 5%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 500px;
            height: 500px;
        }

        button {
            border: 2px blue solid;
            box-shadow: 0px 0px 4px  blue;
        }
    </style>
</head>
<body>
    
    <div class="container">
         <img 
            src="https://static.wikia.nocookie.net/teen-titans-go/images/d/d4/2b6b161ef7f2bc36031c6f772fdb9cd7.png/revision/latest?cb=20200124150531&path-prefix=pt-br" alt="">
    
    <p></p>

    <button>trocar Imagem</button>

    </div>
   

    <script>

        let paragrafo = document.querySelector('p');
        let imagem = document.querySelector('img');
        let botao = document.querySelector('button');

        imagem.onclick = clicou;
        imagem.onmouseenter = mouseEnter;
        imagem.onmousemove = mouseMove;
        imagem.onmouseleave = mouseLeave;

        function clicou(){
            paragrafo.textContent = "para de me cutucar";
        }

        function mouseEnter(){
            paragrafo.textContent = "para de me alisar maninho";
        }

        function mouseMove(){
            paragrafo.textContent = "Para de me fazer carinho mano";
        }

        function mouseLeave(){
            paragrafo.textContent = "Não saiiiii!";
        }

        botao.addEventListener('click', () => {
            
            if (imagem.src == "https://static.wikia.nocookie.net/teen-titans-go/images/d/d4/2b6b161ef7f2bc36031c6f772fdb9cd7.png/revision/latest?cb=20200124150531&path-prefix=pt-br") {

                imagem.src = "https://i.pinimg.com/originals/99/76/5d/99765d9afa8efa07b474b858a33184e0.png";

            } else if (imagem.src == "https://i.pinimg.com/originals/99/76/5d/99765d9afa8efa07b474b858a33184e0.png") {

                imagem.src = "https://i.pinimg.com/originals/67/27/e2/6727e23374afbc8999642d4f062a33c2.png";

            }
        })

    </script>
</body>
</html>
